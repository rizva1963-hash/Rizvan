name: Build APK
on:
  push:
    branches: [dohod-app]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build
        id: build
        continue-on-error: true
        run: |
          chmod +x gradlew
          set -o pipefail
          { echo "ANDROID_HOME=$ANDROID_HOME"; ls $ANDROID_HOME/platforms $ANDROID_HOME/build-tools; java -version; } > build.log 2>&1 || true
          ./gradlew --no-daemon testDebugUnitTest -i assembleRelease 2>&1 | tee -a build.log
      - name: Publish result to apk-out branch
        if: always()
        run: |
          mkdir -p out
          cp build.log out/ || true
          cp app/build/outputs/apk/release/*.apk out/DohodRashod.apk 2>/dev/null || true
          grep -E "=>|^e: |error:|FAILED|BUILD" build.log > out/summary.txt || true
          echo "${{ steps.build.outcome }} ${{ github.sha }}" > out/status.txt
          cd out
          git init -q -b apk-out
          git config user.name ci; git config user.email ci@example.com
          git add -A; git commit -qm "build ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" apk-out
