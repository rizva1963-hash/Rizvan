name: Build APK
on:
  push:
    branches: [dohod-app]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build
        id: build
        continue-on-error: true
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest -i assembleDebug assembleRelease 2>&1 | tee build.log
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Screenshots on emulator
        if: steps.build.outcome == 'success'
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash ci/shots.sh
      - name: Publish result to apk-out branch
        if: always()
        run: |
          mkdir -p out
          cp build.log out/ || true
          cp app/build/outputs/apk/release/*.apk out/DohodRashod.apk 2>/dev/null || true
          grep -E "=>|^e: |error:|FAILED|BUILD" build.log > out/summary.txt || true
          echo "${{ steps.build.outcome }} ${{ github.sha }}" > out/status.txt
          cd out
          git init -q -b apk-out
          git config user.name ci; git config user.email ci@example.com
          git add -A; git commit -qm "build ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" apk-out
